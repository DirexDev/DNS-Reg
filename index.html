<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowa Karta // Konfiguracja NETp DNS</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333333;
            --accent-color: #007acc;
            --accent-hover: #1c97ea;
            --text-main: #ffffff;
            --text-muted: #a6a6a6;
            --font-ui: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --font-mono: 'Consolas', 'Courier New', monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-ui);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .newtab-container {
            width: 100%;
            max-width: 620px;
        }

        .header-brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-brand h1 {
            font-size: 28px;
            font-weight: 300;
            margin: 0;
            letter-spacing: 1px;
        }

        .header-brand h1 span {
            color: var(--accent-color);
            font-weight: 600;
        }

        .header-brand p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 6px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 11px 14px;
            background-color: #0d0d0d;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            font-family: var(--font-ui);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: var(--text-main);
            border: none;
            border-radius: 4px;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .cli-output {
            margin-top: 20px;
            background-color: #080808;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px 15px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: #4af626;
            min-height: 48px;
            box-sizing: border-box;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="newtab-container">
        <div class="header-brand">
            <h1><span>NETp</span> // Konfiguracja DNS</h1>
            <p>Szybkie mapowanie nazw domeny na punkty wywołania ip / nazwa / plik</p>
        </div>

        <div class="card">
            <div class="form-group">
                <label for="dns-domain">Nazwa domeny NETp:</label>
                <input type="text" id="dns-domain" placeholder="dns-reg@org.netp">
            </div>

            <div class="row">
                <div class="form-group" style="flex: 2;">
                    <label for="dns-ip">Adres IP serwera:</label>
                    <input type="text" id="dns-ip" placeholder="185.199.110.153">
                </div>
                <div class="form-group" style="flex: 1.2;">
                    <label for="dns-type">Typ zasobu:</label>
                    <select id="dns-type">
                        <option value="Website">Website</option>
                        <option value="StaciTree">StaciTree</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 0.8;">
                    <label for="dns-port">Port:</label>
                    <input type="text" id="dns-port" value="443">
                </div>
            </div>

            <div class="form-group">
                <label for="dns-path">Ścieżka zasobu (plik / nazwa):</label>
                <input type="text" id="dns-path" placeholder="/DNS-Reg/index.html">
            </div>

            <button class="btn-submit" onclick="saveConfiguration()">Zapisz trasę w Firebase</button>

            <div id="cli-output" class="cli-output">
                > System gotowy. Wprowadź konfigurację wpisu...
            </div>
        </div>
    </div>

    <script>
        const DB_URL = "https://netp-6bb62-default-rtdb.firebaseio.com/dns";

        function logToCli(msg) {
            document.getElementById('cli-output').innerHTML = `> ${msg}`;
        }

        async function saveConfiguration() {
            const domain = document.getElementById('dns-domain').value.trim();
            const ip = document.getElementById('dns-ip').value.trim();
            const type = document.getElementById('dns-type').value;
            const port = document.getElementById('dns-port').value.trim();
            const path = document.getElementById('dns-path').value.trim();

            if (!domain || !ip || !port) {
                logToCli("<span style='color: #e81123;'>BŁĄD: Wypełnij nazwę domeny, IP oraz port!</span>");
                return;
            }

            // Standaryzacja klucza dla Firebase (kropki, małpy, myślniki na głąb gładkie podkreślenia)
            const domainKey = domain.toLowerCase().replace(/[\.@-]/g, "_");
            const targetPath = path ? (path.startsWith('/') ? path : '/' + path) : '/';

            logToCli(`Wysyłanie konfiguracji dla ${domain}...`);

            try {
                const res = await fetch(`${DB_URL}/${domainKey}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        domain: domain,
                        ip: ip,
                        type: type,
                        port: port,
                        path: targetPath,
                        timestamp: Date.now()
                    })
                });

                if (res.ok) {
                    logToCli(`SUKCES: Zapisano trasy -> ${ip}:${port}${targetPath} (${type})`);
                } else {
                    logToCli("<span style='color: #e81123;'>BŁĄD: Odrzucono zapytanie przez Firebase.</span>");
                }
            } catch (err) {
                logToCli("<span style='color: #e81123;'>BŁĄD SIECI: Nie można połączyć z bazą.</span>");
            }
        }
    </script>
</body>
</html>
